# Basemap static file server (D6, ARCHITECTURE.md §1.1: Basemap 8802 Static).
#
# The MapLibre client reads the extract with the pmtiles.js protocol,
# which issues plain HTTPS Range requests against the raw archive. The
# `pmtiles serve` command does NOT serve raw archives (upstream docs:
# use a standard web server for those), so this is nginx, not the
# pmtiles server image. nginx serves byte ranges natively; the headers
# below add the CORS the browser client needs. No tile rendering or
# transcoding happens here — it is a file server, nothing more.
#
# Paths:
#   /maharashtra.pmtiles  the ODbL extract (RESULTS.md tiles-audit row)
#   /maharashtra          exact-match alias for the compose healthcheck

server {
    listen 8802;

    # Exact-match alias so GET /maharashtra returns 200 (healthcheck).
    location = /maharashtra {
        alias /tiles/maharashtra.pmtiles;
        add_header Access-Control-Allow-Origin * always;
    }

    # Local offline glyphs (infra/tiles/glyphs/, Apache 2.0 via OpenMapTiles
    # v2.0). Served by this same host so MapLibre never requests font glyphs
    # from a third party (D6, rule 6). Mounted read-only in all-in-one.yml.
    location /glyphs/ {
        alias /tiles/glyphs/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400";
        types { application/x-protobuf pbf; }
        default_type application/x-protobuf;
    }

    location / {
        root /tiles;
        add_header Access-Control-Allow-Origin * always;
    }
}
