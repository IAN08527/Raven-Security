# Multi-org Fabric network (M5-T2, D22). Three organisations with
# separate MSPs, one Raft orderer, endorsement policy
# AND('district-cid.member', 'cyber-cell.member') -- two of three orgs
# must sign, so altering a record requires collusion across agencies.
#
# Dev topology (single peer per org, single orderer). Production needs
# three orderers and two peers per org; the MSP layout and policy are
# unchanged by that scale-up.
#
# Bring-up order (see README.md): crypto -> genesis block -> up ->
# channel create/join -> chaincode deploy.

version: '3.8'

networks:
  raven-fabric:
    name: raven-fabric

volumes:
  orderer.raven.local:
  peer0.district-cid.raven.local:
  peer0.cyber-cell.raven.local:
  peer0.records-bureau.raven.local:

services:
  ca-district-cid:
    image: hyperledger/fabric-ca:1.5.9
    container_name: ca-district-cid.raven.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-district-cid
      - FABRIC_CA_SERVER_TLS_ENABLED=false
    ports:
      - '7054:7054'
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    networks:
      - raven-fabric

  ca-cyber-cell:
    image: hyperledger/fabric-ca:1.5.9
    container_name: ca-cyber-cell.raven.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-cyber-cell
      - FABRIC_CA_SERVER_TLS_ENABLED=false
    ports:
      - '8054:7054'
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    networks:
      - raven-fabric

  ca-records-bureau:
    image: hyperledger/fabric-ca:1.5.9
    container_name: ca-records-bureau.raven.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-records-bureau
      - FABRIC_CA_SERVER_TLS_ENABLED=false
    ports:
      - '9054:7054'
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    networks:
      - raven-fabric

  orderer.raven.local:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer.raven.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/raven.local/orderers/orderer.raven.local/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/raven.local/orderers/orderer.raven.local/tls:/var/hyperledger/orderer/tls
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - orderer.raven.local:/var/hyperledger/production/orderer
    ports:
      - '7050:7050'
    networks:
      - raven-fabric

  peer0.district-cid.raven.local:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.district-cid.raven.local
    environment:
      - CORE_PEER_ID=peer0.district-cid.raven.local
      - CORE_PEER_ADDRESS=peer0.district-cid.raven.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.district-cid.raven.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.district-cid.raven.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.district-cid.raven.local:7051
      - CORE_PEER_LOCALMSPID=district-cid
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/district-cid.raven.local/peers/peer0.district-cid.raven.local/msp:/etc/hyperledger/fabric/msp
      - peer0.district-cid.raven.local:/var/hyperledger/production
    ports:
      - '7051:7051'
    depends_on:
      - orderer.raven.local
    networks:
      - raven-fabric

  peer0.cyber-cell.raven.local:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.cyber-cell.raven.local
    environment:
      - CORE_PEER_ID=peer0.cyber-cell.raven.local
      - CORE_PEER_ADDRESS=peer0.cyber-cell.raven.local:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.cyber-cell.raven.local:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.cyber-cell.raven.local:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.cyber-cell.raven.local:8051
      - CORE_PEER_LOCALMSPID=cyber-cell
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/cyber-cell.raven.local/peers/peer0.cyber-cell.raven.local/msp:/etc/hyperledger/fabric/msp
      - peer0.cyber-cell.raven.local:/var/hyperledger/production
    ports:
      - '8051:8051'
    depends_on:
      - orderer.raven.local
    networks:
      - raven-fabric

  peer0.records-bureau.raven.local:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.records-bureau.raven.local
    environment:
      - CORE_PEER_ID=peer0.records-bureau.raven.local
      - CORE_PEER_ADDRESS=peer0.records-bureau.raven.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.records-bureau.raven.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.records-bureau.raven.local:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.records-bureau.raven.local:9051
      - CORE_PEER_LOCALMSPID=records-bureau
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/records-bureau.raven.local/peers/peer0.records-bureau.raven.local/msp:/etc/hyperledger/fabric/msp
      - peer0.records-bureau.raven.local:/var/hyperledger/production
    ports:
      - '9051:9051'
    depends_on:
      - orderer.raven.local
    networks:
      - raven-fabric
