# Neo4j 5 Community for Raven (section 11.5)
# Start: docker compose -f docker-compose.neo4j.yml up -d
# Healthcheck: wait for Bolt on 7687 before bringing up the app.
services:
  neo4j:
    image: neo4j:5-community
    container_name: raven-neo4j
    environment:
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_AUTH: neo4j/raven-demo-pw
      NEO4J_dbms_security_auth__minimum__password__length: "5"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - raven-neo4j-data:/data
      - ./cypher:/cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  raven-neo4j-data:
