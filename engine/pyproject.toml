[project]
name = "raven-engine"
version = "0.1.0"
description = "Raven camera node: decode, detect, track, embed."
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn==0.30.*",
    "pydantic>=2,<3",
    "numpy==1.26.*",
    "psycopg[binary]>=3,<4",
    "neo4j>=5,<6",
    "opencv-python-headless==4.10.*",
    "scipy==1.14.*",
    "scikit-learn==1.5.*",
    "av==18.1.*",
    "torch==2.8.*",
    "torchvision==0.23.*",
    "ultralytics==8.4.*",
    "httpx>=0.28,<1",
    "python-ulid>=4,<5",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "psutil"]

[tool.pytest.ini_options]
markers = [
    "slow: full-duration tests (e.g. the M1-T2 1-hour soak run); excluded by default",
]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
