[package]
name = "raven_saga_cli"
version = "0.1.0"
edition = "2021"
description = "Headless harness that runs the Raven ingest saga against the cloud (no Tauri/WebView2)"

[[bin]]
name = "raven_saga_cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
raven-core = { path = "../../src-tauri/core" }
dotenvy = "0.15"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "json"] }
sha2 = "0.10"
