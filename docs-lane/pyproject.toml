[project]
name = "raven-docs-lane"
version = "0.1.0"
description = "Raven server-side document lane: prepare, segment, script ID, recognise, extract."
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn==0.30.*",
    "pydantic>=2,<3",
    "numpy==1.26.*",
    "psycopg[binary]>=3,<4",
    "neo4j>=5,<6",
    "opencv-python-headless==4.10.*",
    "scipy==1.14.*",
    "scikit-learn==1.5.*",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
