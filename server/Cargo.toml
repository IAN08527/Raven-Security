[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "raven-server"
path = "src/main.rs"

[dependencies]
# D34: `multipart` powers the file-upload handler. reqwest `multipart`
# powers the docs-lane OCR call (Part 4 POSTs file bytes as multipart);
# both are local-loopback transports, not egress (rule 6).
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "time", "json"] }
neo4rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
# D35: pure-Rust PDF text extraction for the digital/scanned routing
# heuristic. No network features (rule 6).
lopdf = "0.32"
# D34: magic-byte MIME sniffing, never the filename or Content-Type.
infer = "0.15"
tower-http = { version = "0.5", features = ["trace", "cors", "limit"] }
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
# ts-rs 10.1.0 has no `chrono`/`uuid` features (those names do not exist
# upstream): `uuid-impl` maps Uuid to string, `serde-json-impl` maps
# serde_json::Value to a JsonValue enum. There is no impl for
# time::OffsetDateTime, so every case-clock field carries an explicit
# #[ts(type = "string")] (RFC 3339 on the wire). chrono-impl is omitted:
# no chrono type crosses the API boundary (D16 uses time, not chrono).
ts-rs = { version = "10", features = ["uuid-impl", "serde-json-impl"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros", "serde-well-known"] }
uuid = { version = "1", features = ["v4", "serde"] }
ulid = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Part 4: loopback mock docs-lane for client tests (hermetic, rule 6).
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
