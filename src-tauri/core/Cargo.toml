[package]
name = "raven-core"
version = "0.1.0"
description = "Raven storage/saga core (no Tauri) - testable headless"
authors = ["Raven Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "raven_core"
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
neo4rs = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "json", "chrono"] }
sha2 = "0.10"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
infer = "0.16"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
dotenvy = "0.15"
