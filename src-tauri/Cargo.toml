[package]
name = "raven"
version = "0.1.0"
description = "Project Raven - AI Criminal Network Analysis (native Windows desktop)"
authors = ["Raven Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "raven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
raven-core = { path = "core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
neo4rs = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["core"]
